name: certikart-pipeline-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certikart}
      POSTGRES_USER: ${POSTGRES_USER:-certikart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certikart_dev_only}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - certikart_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db-ui:
    image: sosedoff/pgweb:latest
    restart: unless-stopped
    ports:
      - "${DB_UI_PORT:-8081}:8081"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-certikart}:${POSTGRES_PASSWORD:-certikart_dev_only}@postgres:5432/${POSTGRES_DB:-certikart}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  pipeline:
    profiles: ["tools"]
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      CERTIKART_ENVIRONMENT: development
      CERTIKART_LOG_LEVEL: ${CERTIKART_LOG_LEVEL:-INFO}
      CERTIKART_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-certikart}:${POSTGRES_PASSWORD:-certikart_dev_only}@postgres:5432/${POSTGRES_DB:-certikart}
      CERTIKART_REQUEST_TIMEOUT_SECONDS: ${CERTIKART_REQUEST_TIMEOUT_SECONDS:-30}
      CERTIKART_MAX_SOURCE_CONCURRENCY: ${CERTIKART_MAX_SOURCE_CONCURRENCY:-2}
      CERTIKART_OBEY_ROBOTS_TXT: ${CERTIKART_OBEY_ROBOTS_TXT:-true}
      CERTIKART_COLLECTION_PROFILE: ${CERTIKART_COLLECTION_PROFILE:-smoke}
    init: true
    command: ["doctor"]

volumes:
  certikart_postgres_data:
